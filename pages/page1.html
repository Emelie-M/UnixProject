<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music App</title>
  <link rel="stylesheet" href="../css/Style.css">

</head>
<body>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Playlist</h2>
    <ul id="playlist"></ul>
  </aside>

  <!-- MAIN -->
  <main class="main">

      <!-- VINYL -->
      <div class="vinyl-wrapper">
        <div class="vinyl" id="vinyl">
          <img src="../images/vinyl.svg" class="vinyl-img">
          <div class="vinyl-label"></div>
        </div>
      </div>

    <!-- HERO -->
    <div class="hero">

      <!-- TEXT -->
      <div class="hero-text">
        <h1 id="title">No song selected</h1>
        <p id="artist">Select a track</p>

        <button id="playHero">PLAY</button>

        <div id="trackList" class="track-list"></div>
      </div>

    </div>

    <!-- SONG GRID -->
    <h2>All Songs</h2>
    <div id="songList" class="row"></div>

  </main>
</div>

<!-- PLAYER -->
<div class="player">

  <div class="track-info">
    <span id="currentTitle">No song</span>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
  </div>

  <div class="progress-container">
    <span id="currentTime">0:00</span>
    <input type="range" id="progress" value="0">
    <span id="duration">0:00</span>
  </div>

  <audio id="audio"></audio>

<script src="../script/javascript.js"></script>
</body>
</html>

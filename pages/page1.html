<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music App</title>
  <link rel="stylesheet" href="../css/Style.css">
  <script src = "../script/javascript.js"></script>
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Playlist</h2>
    <ul id="playlist"></ul>

    <input id="songInput" placeholder="Add song URL">
    <button id="add">Add</button>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-text">
        <h1 id="title">No song selected</h1>
        <p>Play your favorite tracks</p>
        <button id="playHero">PLAY</button>
      </div>
    </div>

    <!-- Albums -->
    <h2>Popular Albums</h2>
    <div class="row">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>

    <!-- Artists -->
    <h2>Popular Artists</h2>
    <div class="row">
      <div class="artist"></div>
      <div class="artist"></div>
      <div class="artist"></div>
      <div class="artist"></div>
    </div>

  </main>
</div>

<div class="player">

  <div class="track-info">
    <span id="currentTitle">No song</span>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play">▶️</button>
    <button id="next">⏭</button>
  </div>

  <div class="progress-container">
    <span id="currentTime">0:00</span>
    <input type="range" id="progress" value="0">
    <span id="duration">0:00</span>
  </div>

  <audio id="audio"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
